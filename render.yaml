services:
  - type: web
    name: invoice-generator-v2
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-generator-v2-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: invoice-generator-v2-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "18"
    diskSizeGB: 1
    ipAllowList: []
