{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
<section class="card saved-card">
  <p class="eyebrow">Error {{ error.code }}</p>
  <h1>We couldn’t complete that request.</h1>
  <p>{{ error.description }}</p>
  <a class="button button-primary" href="{{ url_for('home') }}">Return home</a>
</section>
{% endblock %}
